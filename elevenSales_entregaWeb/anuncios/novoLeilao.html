<body>
    <h1>Criar Novo Leilão</h1>
    <label for="nome">Nome do leilão:</label>
    <input type="text" id="nome" required>
    <br>
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" required>
    <br>
    <label for="preco">Preço para compra imediata:</label>
    <input type="number" id="preco" required>
    <br>
    <label for="lanceInicial">Lance inicial:</label>
    <input type="number" id="lanceInicial" required>
    <br>
    <label for="condicao">Condição:</label>
    <select id="condicao">
        <option value="novo">Novo</option>
        <option value="usado">Usado</option>
    </select>
    <br>
    <label for="dataFim">Data de término do leilão:</label>
    <input type="date" id="dataFim" required>
    <br>
    <label for="selectGaragem">Garagem:</label>
    <select id="selectGaragem"></select>
    <br>
    <button id="criarLeilao">Criar leilão</button>

    <script src="../js/criarLeilao.js"></script>
</body>
</html>
