<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Anuncio</title>
</head>
<body>
    <h1>Criar Novo Anúncio</h1>
    <label for="nome">Nome do anúncio:</label>
    <input type="text" id="nome" required>
    <br>
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" required>
    <br>
    <label for="preco">Preço:</label>
    <input type="number" id="preco" required>
    <br>
    <label for="condicao">Condição:</label>
    <select id="condicao">
        <option value="novo">Novo</option>
        <option value="usado">Usado</option>
    </select>
    <label for="garagem">Garagem:</label>
    <select id="garagem"></select>
    <br>
    <button id="criarAnuncio">Criar anuncio</button>

    <script src="../js/criarAnuncios.js"></script>
</body>
</html>
