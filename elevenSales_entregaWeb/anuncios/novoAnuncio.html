<body>
    <h1>Criar Novo Anúncio</h1>
    <label for="nome">Nome do anúncio:</label>
    <input type="text" id="nome" required>
    <br>
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" required>
    <br>
    <label for="preco">Preço:</label>
    <input type="number" id="preco" required>
    <br>
    <label for="condicao">Condição:</label>
    <select id="condicao" required>
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="novo">Novo</option>
        <option value="usado">Usado</option>
    </select>
    <label for="selectGaragem">Garagem:</label>
    <select id="selectGaragem" required></select>

    <br>
    <button type="button" id="criarAnuncio">Criar anúncio</button>

    <script src="../js/criarAnuncios.js"></script>
</body>
